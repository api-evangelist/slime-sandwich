name: Slime Sandwich
description: Slime Sandwich was an online gaming company that developed in-browser 3D games. It was
  founded in 2009 in Englewood, Colorado by Douglas Glover, Vadim Ugov, and former Photobucket CEO Alex
  Welch, and raised a $2.75M Series A round backed by Battery Ventures. The company has since permanently
  ceased operations and its slimesandwich.com domain is no longer active (now a parked/for-sale listing).
  It was originally surfaced as a Battery Ventures portfolio company and added to the API Evangelist
  network as a stub for enrichment; enrichment confirms there is no live company website, developer
  portal, documentation, or public API surface to profile.
